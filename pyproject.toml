[project]
name = "video-to-text"
version = "0.1.0"
description = "批量将抖音分享链接视频转换为 Markdown 文本 (基于 Playwright + SenseVoiceSmall)"
readme = "README.md"
authors = [
    { name = "TerraRiver", email = "20231081107@ucass.edu.cn" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "av>=13.0.0",
    "funasr>=1.1.12",
    "httpx>=0.27.0",
    "modelscope>=1.18.0",
    "numpy>=1.26.0",
    "playwright>=1.48.0",
    "rich>=13.9.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
video-to-text = "video_to_text.cli:main_entry"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
